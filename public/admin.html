<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin – Bare Takst AS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="logo.png?v=2">
<link rel="apple-touch-icon" href="logo.png?v=2">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --navy:#1e3a5f;
  --navy-dark:#152c48;
  --blue:#2563eb;
  --blue-light:#eff6ff;
  --gray-50:#f8fafc;
  --gray-100:#f1f5f9;
  --gray-200:#e2e8f0;
  --gray-400:#94a3b8;
  --gray-600:#475569;
  --gray-800:#1e293b;
  --green:#16a34a;
  --green-light:#f0fdf4;
  --yellow:#d97706;
  --yellow-light:#fffbeb;
  --red:#dc2626;
  --red-light:#fef2f2;
}
body{font-family:'Inter',sans-serif;background:var(--gray-50);color:var(--gray-800);min-height:100vh;}

/* ── Login ── */
#loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1.25rem;}
.login-box{background:#fff;border:1px solid var(--gray-200);border-radius:12px;padding:2.5rem;width:100%;max-width:380px;box-shadow:0 4px 24px rgba(0,0,0,0.06);}
.login-logo{font-size:1.1rem;font-weight:700;color:var(--navy);margin-bottom:0.25rem;}
.login-logo span{color:var(--blue);}
.login-sub{font-size:13px;color:var(--gray-400);margin-bottom:2rem;}
.login-box label{display:block;font-size:13px;font-weight:500;color:var(--gray-800);margin-bottom:5px;}
.login-box input{width:100%;padding:12px 13px;border:1.5px solid var(--gray-200);border-radius:6px;font-family:'Inter',sans-serif;font-size:16px;/* 16px prevents iOS zoom */outline:none;transition:border-color 0.15s;margin-bottom:1rem;}
.login-box input:focus{border-color:var(--blue);}
.login-btn{width:100%;padding:13px;background:var(--navy);color:#fff;border:none;border-radius:6px;font-family:'Inter',sans-serif;font-weight:600;font-size:15px;cursor:pointer;transition:background 0.15s;}
.login-btn:hover{background:var(--navy-dark);}
.login-error{margin-top:0.75rem;padding:0.75rem 1rem;background:var(--red-light);border-radius:6px;color:var(--red);font-size:13px;display:none;}
.login-error.show{display:block;}

/* ── App shell ── */
#appScreen{display:none;}
header{background:var(--navy);padding:0 1.25rem;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.header-logo{font-size:14px;font-weight:700;color:#fff;white-space:nowrap;}
.header-logo span{color:#93c5fd;}
.header-right{display:flex;align-items:center;gap:0.75rem;}
.header-right a{color:rgba(255,255,255,0.6);text-decoration:none;font-size:13px;display:none;}
@media(min-width:640px){.header-right a{display:inline;}}
.logout-btn{background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.2);padding:7px 14px;border-radius:5px;font-family:'Inter',sans-serif;font-size:13px;cursor:pointer;transition:background 0.15s;white-space:nowrap;}
.logout-btn:hover{background:rgba(255,255,255,0.2);}

.main{max-width:1200px;margin:0 auto;padding:1.25rem;}

/* ── Stats ── */
.stats-row{display:grid;grid-template-columns:repeat(2,1fr);gap:0.75rem;margin-bottom:1.25rem;}
@media(min-width:640px){.stats-row{grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1.75rem;}}
.stat-card{background:#fff;border:1px solid var(--gray-200);border-radius:8px;padding:1rem 1.25rem;}
.stat-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.07em;color:var(--gray-400);margin-bottom:0.35rem;}
.stat-num{font-size:1.75rem;font-weight:700;color:var(--gray-800);}
@media(min-width:640px){.stat-num{font-size:2rem;}}

/* ── Toolbar ── */
.toolbar{display:flex;flex-wrap:wrap;gap:0.5rem;margin-bottom:1rem;align-items:center;}
.toolbar input{padding:10px 13px;border:1.5px solid var(--gray-200);border-radius:6px;font-family:'Inter',sans-serif;font-size:16px;/* 16px prevents iOS zoom */outline:none;width:100%;}
@media(min-width:480px){.toolbar input{width:220px;font-size:14px;}}
.toolbar input:focus{border-color:var(--blue);}
.filter-wrap{display:flex;gap:0.5rem;flex-wrap:wrap;}
.filter-btn{padding:8px 13px;border:1.5px solid var(--gray-200);border-radius:6px;background:#fff;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;cursor:pointer;color:var(--gray-600);transition:all 0.15s;white-space:nowrap;-webkit-tap-highlight-color:transparent;}
.filter-btn.active,.filter-btn:hover{border-color:var(--navy);color:var(--navy);}
.refresh-btn{padding:9px 14px;border:1.5px solid var(--gray-200);border-radius:6px;background:#fff;font-family:'Inter',sans-serif;font-size:13px;cursor:pointer;color:var(--gray-600);display:flex;align-items:center;gap:6px;margin-left:auto;white-space:nowrap;-webkit-tap-highlight-color:transparent;}
.refresh-btn:hover{border-color:var(--navy);color:var(--navy);}

/* ── Table (desktop) ── */
.table-wrap{background:#fff;border:1px solid var(--gray-200);border-radius:10px;overflow:hidden;}
table{width:100%;border-collapse:collapse;}
thead{background:var(--gray-50);}
th{padding:11px 14px;text-align:left;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--gray-400);border-bottom:1px solid var(--gray-200);}
td{padding:13px 14px;font-size:14px;color:var(--gray-600);border-bottom:1px solid var(--gray-100);vertical-align:top;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--gray-50);}
.name{font-weight:600;color:var(--gray-800);}
.meta{font-size:12px;color:var(--gray-400);margin-top:2px;}

.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600;}
.badge-ny{background:#dbeafe;color:#1e40af;}
.badge-kontaktet{background:var(--yellow-light);color:var(--yellow);}
.badge-fullfort{background:var(--green-light);color:var(--green);}
.badge-avbrutt{background:var(--red-light);color:var(--red);}

.status-select{padding:7px 8px;border:1.5px solid var(--gray-200);border-radius:5px;font-family:'Inter',sans-serif;font-size:14px;cursor:pointer;background:#fff;color:var(--gray-800);outline:none;-webkit-appearance:auto;}
.status-select:focus{border-color:var(--blue);}

.del-btn{padding:7px 12px;border:1.5px solid var(--gray-200);border-radius:5px;background:#fff;color:var(--red);font-family:'Inter',sans-serif;font-size:13px;cursor:pointer;transition:all 0.15s;-webkit-tap-highlight-color:transparent;}
.del-btn:hover{border-color:var(--red);background:var(--red-light);}

.empty{padding:3rem;text-align:center;color:var(--gray-400);font-size:15px;}
.loading{padding:3rem;text-align:center;color:var(--gray-400);}

/* Hide table on mobile, show cards */
@media(max-width:767px){
  .table-wrap{background:transparent;border:none;border-radius:0;overflow:visible;}
  table,thead,tbody,th,td,tr{display:block;}
  thead{display:none;}
  tbody tr{
    background:#fff;
    border:1px solid var(--gray-200);
    border-radius:10px;
    margin-bottom:0.75rem;
    padding:1rem;
    display:flex;
    flex-direction:column;
    gap:0.6rem;
    box-shadow:0 1px 4px rgba(0,0,0,0.04);
  }
  tbody tr:last-child{margin-bottom:0;}
  tbody tr:hover td{background:transparent;}
  td{padding:0;border:none;font-size:14px;}
  td:empty{display:none;}
  .card-row{display:flex;justify-content:space-between;align-items:flex-start;gap:0.5rem;}
  .card-actions{display:flex;gap:0.5rem;align-items:center;margin-top:0.25rem;}
  .card-id{font-size:12px;color:var(--gray-400);}
}

/* Show table on desktop */
@media(min-width:768px){
  .table-wrap{background:#fff;border:1px solid var(--gray-200);border-radius:10px;overflow:hidden;}
  table{display:table;}
  thead{display:table-header-group;}
  tbody{display:table-row-group;}
  tbody tr{display:table-row;}
  td,th{display:table-cell;}
}
</style>
</head>
<body>

<!-- Login -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">Bare Takst <span>AS</span></div>
    <div class="login-sub">Adminpanel – kun for intern bruk</div>
    <label>Passord</label>
    <input type="password" id="passordInput" placeholder="Skriv inn passord" onkeydown="if(event.key==='Enter')loggInn()" autocomplete="current-password">
    <button class="login-btn" onclick="loggInn()">Logg inn</button>
    <div class="login-error" id="loginError">Feil passord. Prøv igjen.</div>
  </div>
</div>

<!-- App -->
<div id="appScreen">
  <header>
    <div class="header-logo">Bare Takst <span>AS</span> · Admin</div>
    <div class="header-right">
      <a href="/" target="_blank">← Til nettside</a>
      <button class="logout-btn" onclick="loggUt()">Logg ut</button>
    </div>
  </header>

  <div class="main">
    <div class="stats-row" id="statsRow">
      <div class="stat-card"><div class="stat-label">Totalt</div><div class="stat-num" id="statTotalt">–</div></div>
      <div class="stat-card"><div class="stat-label">Nye</div><div class="stat-num" id="statNy">–</div></div>
      <div class="stat-card"><div class="stat-label">Kontaktet</div><div class="stat-num" id="statKontaktet">–</div></div>
      <div class="stat-card"><div class="stat-label">Fullført</div><div class="stat-num" id="statFullfort">–</div></div>
    </div>

    <div class="toolbar">
      <input type="text" id="sokInput" placeholder="Søk navn, telefon, adresse..." oninput="renderTabell()">
      <div class="filter-wrap">
        <button class="filter-btn active" onclick="setFilter('', this)">Alle</button>
        <button class="filter-btn" onclick="setFilter('Ny', this)">Nye</button>
        <button class="filter-btn" onclick="setFilter('Kontaktet', this)">Kontaktet</button>
        <button class="filter-btn" onclick="setFilter('Fullfort', this)">Fullført</button>
        <button class="filter-btn" onclick="setFilter('Avbrutt', this)">Avbrutt</button>
      </div>
      <button class="refresh-btn" onclick="lastBestillinger()">↻ Oppdater</button>
    </div>

    <div class="table-wrap">
      <div class="loading" id="loading">Laster bestillinger...</div>

      <!-- Desktop table -->
      <table id="bestillTabell" style="display:none">
        <thead>
          <tr>
            <th>#</th>
            <th>Kunde</th>
            <th>Kontakt</th>
            <th>Tjeneste</th>
            <th>Bolig</th>
            <th>Dato</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tabellBody"></tbody>
      </table>

      <!-- Mobile cards -->
      <div id="kortContainer" style="display:none"></div>

      <div class="empty" id="emptyMsg" style="display:none">Ingen bestillinger funnet.</div>
    </div>
  </div>
</div>

<script>
let passord = '';
let alleBestillinger = [];
let aktivFilter = '';

function isMobile() {
  return window.innerWidth < 768;
}

function loggInn() {
  const p = document.getElementById('passordInput').value;
  if (!p) return;
  passord = p;
  lastBestillinger();
}

function loggUt() {
  passord = '';
  alleBestillinger = [];
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('appScreen').style.display = 'none';
  document.getElementById('passordInput').value = '';
}

function setFilter(filter, btn) {
  aktivFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTabell();
}

async function lastBestillinger() {
  try {
    const res = await fetch('/api/admin/bestillinger', {
      headers: { 'x-admin-password': passord }
    });
    if (res.status === 401) {
      document.getElementById('loginError').classList.add('show');
      return;
    }
    document.getElementById('loginError').classList.remove('show');
    alleBestillinger = await res.json();

    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appScreen').style.display = 'block';
    document.getElementById('loading').style.display = 'none';

    oppdaterStats();
    renderTabell();
  } catch (err) {
    alert('Kunne ikke koble til serveren.');
  }
}

function oppdaterStats() {
  document.getElementById('statTotalt').textContent = alleBestillinger.length;
  document.getElementById('statNy').textContent = alleBestillinger.filter(b => b.status === 'Ny').length;
  document.getElementById('statKontaktet').textContent = alleBestillinger.filter(b => b.status === 'Kontaktet').length;
  document.getElementById('statFullfort').textContent = alleBestillinger.filter(b => b.status === 'Fullfort').length;
}

function filtrerListe() {
  const sok = document.getElementById('sokInput').value.toLowerCase();
  let liste = alleBestillinger;
  if (aktivFilter) liste = liste.filter(b => b.status === aktivFilter);
  if (sok) liste = liste.filter(b =>
    `${b.fornavn} ${b.etternavn} ${b.telefon} ${b.epost} ${b.adresse || ''}`.toLowerCase().includes(sok)
  );
  return liste;
}

function renderTabell() {
  const liste = filtrerListe();
  const empty = document.getElementById('emptyMsg');
  const table = document.getElementById('bestillTabell');
  const kort = document.getElementById('kortContainer');

  if (liste.length === 0) {
    table.style.display = 'none';
    kort.style.display = 'none';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  if (isMobile()) {
    table.style.display = 'none';
    kort.style.display = 'block';
    renderKort(liste);
  } else {
    kort.style.display = 'none';
    table.style.display = 'table';
    renderDesktopTabell(liste);
  }
}

function renderDesktopTabell(liste) {
  const tbody = document.getElementById('tabellBody');
  tbody.innerHTML = liste.map(b => {
    const dato = formatDato(b.opprettet);
    return `<tr>
      <td style="color:var(--gray-400);font-size:13px">#${b.id}</td>
      <td>
        <div class="name">${esc(b.fornavn)} ${esc(b.etternavn)}</div>
        ${b.adresse ? `<div class="meta">${esc(b.adresse)}</div>` : ''}
      </td>
      <td>
        <div>${esc(b.telefon)}</div>
        <div class="meta">${esc(b.epost)}</div>
      </td>
      <td>
        <div>${esc(b.tjeneste || '–')}</div>
        ${b.storrelse ? `<div class="meta">${esc(b.storrelse)} m²</div>` : ''}
      </td>
      <td>
        <div>${esc(b.boligtype || '–')}</div>
        ${b.melding ? `<div class="meta" style="max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(b.melding)}</div>` : ''}
      </td>
      <td style="white-space:nowrap">${dato}</td>
      <td>
        <select class="status-select" onchange="oppdaterStatus(${b.id}, this.value)">
          <option ${b.status==='Ny'?'selected':''}>Ny</option>
          <option ${b.status==='Kontaktet'?'selected':''}>Kontaktet</option>
          <option value="Fullfort" ${b.status==='Fullfort'?'selected':''}>Fullført</option>
          <option ${b.status==='Avbrutt'?'selected':''}>Avbrutt</option>
        </select>
      </td>
      <td><button class="del-btn" onclick="slettBestilling(${b.id})">Slett</button></td>
    </tr>`;
  }).join('');
}

function renderKort(liste) {
  const container = document.getElementById('kortContainer');
  container.innerHTML = liste.map(b => {
    const dato = formatDato(b.opprettet);
    const badgeKlasse = {
      'Ny':'badge-ny','Kontaktet':'badge-kontaktet','Fullfort':'badge-fullfort','Avbrutt':'badge-avbrutt'
    }[b.status] || 'badge-ny';
    const badgeLabel = b.status === 'Fullfort' ? 'Fullført' : b.status;

    return `<div style="background:#fff;border:1px solid var(--gray-200);border-radius:10px;padding:1rem;margin-bottom:0.75rem;box-shadow:0 1px 4px rgba(0,0,0,0.04);">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:0.6rem;">
        <div>
          <div class="name" style="font-size:15px;">${esc(b.fornavn)} ${esc(b.etternavn)}</div>
          <div class="meta">${dato} · #${b.id}</div>
        </div>
        <span class="badge ${badgeKlasse}">${esc(badgeLabel)}</span>
      </div>

      ${b.adresse ? `<div style="font-size:13px;color:var(--gray-600);margin-bottom:0.4rem;">📍 ${esc(b.adresse)}</div>` : ''}

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.4rem;font-size:13px;color:var(--gray-600);margin-bottom:0.75rem;">
        <div>📞 <a href="tel:${esc(b.telefon)}" style="color:var(--blue);text-decoration:none;">${esc(b.telefon)}</a></div>
        <div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">✉ <a href="mailto:${esc(b.epost)}" style="color:var(--blue);text-decoration:none;">${esc(b.epost)}</a></div>
        ${b.tjeneste ? `<div>🏠 ${esc(b.tjeneste)}${b.storrelse ? ` · ${esc(b.storrelse)} m²` : ''}</div>` : ''}
        ${b.boligtype ? `<div>🔑 ${esc(b.boligtype)}</div>` : ''}
      </div>

      ${b.melding ? `<div style="font-size:12px;color:var(--gray-400);background:var(--gray-50);border-radius:6px;padding:0.5rem 0.7rem;margin-bottom:0.75rem;font-style:italic;">"${esc(b.melding)}"</div>` : ''}

      <div style="display:flex;gap:0.5rem;align-items:center;">
        <select class="status-select" style="flex:1;font-size:14px;padding:9px 8px;" onchange="oppdaterStatus(${b.id}, this.value)">
          <option ${b.status==='Ny'?'selected':''}>Ny</option>
          <option ${b.status==='Kontaktet'?'selected':''}>Kontaktet</option>
          <option value="Fullfort" ${b.status==='Fullfort'?'selected':''}>Fullført</option>
          <option ${b.status==='Avbrutt'?'selected':''}>Avbrutt</option>
        </select>
        <button class="del-btn" style="padding:9px 14px;" onclick="slettBestilling(${b.id})">Slett</button>
      </div>
    </div>`;
  }).join('');
}

function formatDato(str) {
  return new Date(str).toLocaleDateString('no-NO', { day:'2-digit', month:'short', year:'numeric' });
}

function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function oppdaterStatus(id, status) {
  await fetch(`/api/admin/bestillinger/${id}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', 'x-admin-password': passord },
    body: JSON.stringify({ status })
  });
  const b = alleBestillinger.find(x => x.id === id);
  if (b) b.status = status;
  oppdaterStats();
  // Re-render to update badge colour on mobile
  renderTabell();
}

async function slettBestilling(id) {
  if (!confirm('Slette denne bestillingen?')) return;
  await fetch(`/api/admin/bestillinger/${id}`, {
    method: 'DELETE',
    headers: { 'x-admin-password': passord }
  });
  alleBestillinger = alleBestillinger.filter(b => b.id !== id);
  oppdaterStats();
  renderTabell();
}

// Re-render on resize so table ↔ cards switch happens live
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(renderTabell, 150);
});
</script>
</body>
</html>
